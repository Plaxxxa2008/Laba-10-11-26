name: TruffleHog Secret Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Скачиваем текущий снимок кода (достаточно depth: 1, так как проверяем файлы)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Шаг 2: Запускаем сканирование файловой системы без фильтрации результатов
      - name: TruffleHog OSS Scan (Filesystem)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Явно переводим в режим filesystem и отключаем только подтвержденные находки
          extra_args: "filesystem --only-verified=false"
