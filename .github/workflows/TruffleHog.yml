name: TruffleHog Secret Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Скачиваем репозиторий. Важно выставить fetch-depth: 0,
      # чтобы TruffleHog проверил всю историю коммитов, а не только текущее состояние.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Шаг 2: Запускаем сканирование секретов без строгой валидации
      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # Убираем --results=verified,unknown, чтобы увидеть неактивные токены
          extra_args: ""
